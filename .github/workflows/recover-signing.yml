name: Recover signing secrets (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signing-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'cabrata/utaloom-android' && github.actor == 'cabrata' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt signing secrets for local recovery
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEJzCCAo+gAwIBAgIUWIaJjgeGZA2GCadCLCowaF54ITQwDQYJKoZIhvcNAQEL
          BQAwIzEhMB8GA1UEAwwYdXRhbG9vbS1zaWduaW5nLXJlY292ZXJ5MB4XDTI2MTEy
          NTExMDYyMFoXDTI2MTIwMjExMDYyMFowIzEhMB8GA1UEAwwYdXRhbG9vbS1zaWdu
          aW5nLXJlY292ZXJ5MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA2E/6
          sQ6EOH0OswvWwZAHtmd2lj+EgQQX/UEe0Modhqgua+6Kls0nSmaIzua9I1XmUhhR
          jwA4sRnIU6e6ueGkv1TWoglXSPw3PzgmhtqC8+W/EUAJfWRi3K5yUu/nXSsQgMS6
          LnuiHUEQLIvWlwNCTLjXujPGtnHzughjFNrtTBSRQaYCN+bCemMhhTaho4VNZIbo
          3ZFvDT10hGAAyaRsEjgl+HQ1UYXUn+EkzZY3bxz6+azyXyp9vOKRaOO7dy/GqW2X
          pNQYocnfHgy4yS+YXCh2DisF8ZEQhC/FOgJiDibyC9VguQHS95qHeHzUzV/PW7QT
          AQzFmpKx1zkyyiaxEv2fRSysv+ntbJuQwzibxp42HX+YkUYBJUoE1dmrkeRz4bI+
          V1h2s0MfoRfZyqhCX1wDihh/lRzu2CXS00ZhVFp3vLjrj6UQLL1incT6NL6Vymbt
          +WXAA4Txps+SrhSeu9ib19Nr02uuxUY+j7N3XOo/5N/kwxn7vtJNO1oYJ9EfAgMB
          AAGjUzBRMB0GA1UdDgQWBBQWxRU8bTCGNYjuBVEa8o4mdhiStzAfBgNVHSMEGDAW
          gBQWxRU8bTCGNYjuBVEa8o4mdhiStzAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3
          DQEBCwUAA4IBgQCi/MKwEywqE4TPnsSzvYzv7LAoou7Y6b+ylBLKBwLYlA7Nugaw
          sS61mY6cSHiFCTCVRqBioyW6wLmg8FdWO+3OHo0pDPirw5FKDKqO49t5Cc9bureX
          DeJJCxQ2QjiE3TNb+qVlJvNc7TY0c41meMaJJaLOOJwLQVSMQIs6PE0gfFnyVOjK
          YFk33juYxh+1tTYqPL0h3+nMuXC4+fzJzbM3y1YoitUp0SuxHvn6clKIi8J71ckS
          uxb7DvIyCAlS6Xrq1Ma1nzDaU2ASzxO16iJbAUnbuYUIkK6tjIIcU2MdZmsn0BDY
          q8boqoJBuPprHB0fsl55AnzHzjNqU+VCXdQMFdpqzbmp1CrqqY4S+xGXUPLw+/8q
          a2ZUqz4/hleUwJllMKZYxWQjq43ynha5OqTDVHXoKZnRjrb8pzG5BZIPK5+rvhHw
          TYRjP8mRlONRQ086QPqg2HgV0oQRIvXO3HFi844Pj7fnD0INBbkHkXLV2vMmO6op
          93xJPumiVo4KZsk=
          -----END CERTIFICATE-----
          CERT
          python3 - <<'PY' | openssl cms -encrypt -aes-256-gcm -binary -outform DER -out "$RUNNER_TEMP/signing-recovery.cms" -recip "$RUNNER_TEMP/recipient.pem" -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256
          import base64
          import json
          import os
          import sys

          names = ("KEYSTORE", "KEYSTORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD")
          if not all(os.environ.get(name) for name in names):
              sys.exit("A required signing secret is missing")
          payload = {name: os.environ[name] for name in names}
          try:
              keystore = base64.b64decode("".join(payload["KEYSTORE"].split()), validate=True)
          except ValueError:
              sys.exit("KEYSTORE is not valid base64")
          if not keystore:
              sys.exit("KEYSTORE is empty")
          json.dump(payload, sys.stdout)
          PY
          test -s "$RUNNER_TEMP/signing-recovery.cms"

      - name: Upload encrypted recovery only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signing-recovery-encrypted
          path: ${{ runner.temp }}/signing-recovery.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
