name: Build Utaloom Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "fastlane/**"
      - "assets/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android compile SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' > /dev/null

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build FOSS debug APK and test updater
        run: bash gradlew :app:assembleFossDebug :app:testFossDebugUnitTest --tests com.metrolist.music.utils.UpdaterTest --console=plain --max-workers=2
        env:
          UTALOOM_BUILD_COMMIT: ${{ github.sha }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/foss/debug/app-foss-debug.apk out/Utaloom-Android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Utaloom-Android-debug
          path: out/*.apk
